name: notification-cron-v2

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      CRON_SECRET_KEY: CRON_SECRET
      APP_URL_KEY: APP_URL
    steps:
      - name: Hit v2 cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          STATUS=$(curl -sL -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/notifications-v2")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          if [ "$STATUS" -ne 200 ]; then
            echo "v2 cron trigger failed"
            exit 1
          fi
