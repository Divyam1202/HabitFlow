name: notification-cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Hit cron endpoint
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notifications")
          echo "HTTP $STATUS"
          cat /tmp/resp.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Cron trigger failed"
            exit 1
          fi